<style>
body{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
h1,h2,h3{font-family:'Schibsted Grotesk', Geist, system-ui, sans-serif !important;font-weight: 700 !important;letter-spacing: -0.02em !important}
.nav-btn:hover,.hov:hover{opacity:.85}
/* The aurora: three radial lights, no blur filter. Still while open; only a sealed screen (.aurora-live) drifts, slowly. */
.aurora-a,.aurora-b,.aurora-c{position:absolute;border-radius:50%;transition:opacity 900ms ease}
.aurora-a{width:900px;height:760px;left:-300px;top:-340px}
.aurora-b{width:960px;height:800px;right:-360px;top:-280px}
.aurora-c{width:1200px;height:620px;left:12%;bottom:-420px}
.aurora-live .aurora-a{animation:auroraA 46s ease-in-out infinite}
.aurora-live .aurora-b{animation:auroraB 54s ease-in-out infinite}
.aurora-live .aurora-c{animation:auroraC 62s ease-in-out infinite}
@keyframes auroraA{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
@keyframes auroraB{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,24px)}}
@keyframes auroraC{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-24px)}}
@keyframes apRise{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.ap-rise>div{animation:apRise 220ms cubic-bezier(.2,.7,.2,1)}
/* One focus ring for every control: 2px accent, 2px off the edge. */
.ap-root :is(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.ap-root *,.ap-root *::before,.ap-root *::after{animation:none !important;transition:none !important}}
</style>
</helmet>

  "Cobalt2": { scheme: "dark", app: "#193549", sidebar: "#142939", panel: "#223D50", raised: "#2B4558", line: "#42596A", lineInput: "#596E7C", text: "#FFFFFF", muted: "#A8B2BA", sealed: "#2AFFDF", event: "#FFC600" },
  "Nord": { scheme: "dark", app: "#2E3440", sidebar: "#242932", panel: "#363C48", raised: "#3F444F", line: "#4F5560", lineInput: "#616771", text: "#E5E9F0", muted: "#A3A8B0", sealed: "#DA878F", event: "#D08770" },
  "Cursor Light": { scheme: "light", app: "#FCFCFC", sidebar: "#EFEFEF", panel: "#FEFEFE", raised: "#F2F2F2", line: "#D2D2D2", lineInput: "#BBBBBB", text: "#141414", muted: "#707070", sealed: "#6B959F", event: "#DB704B" }
};
const HOVER_FOR = { "Aura": "Cobalt2", "Sanctum Dark": "Cobalt2", "Night Owl": "Nord", "Cobalt2 Light": "Cursor Light" };
const ROW_H = 41;
// The scroll box, measured from main's top: padding 20, title 32, gap 16, tab head 38, gap 16. It runs to 24 above the bottom.
const VIEW_TOP = 122, VIEW_H = 800 - VIEW_TOP - 24;
// Inside it: Theme section 90, gap 20, group title 18, gap 8, the list's 1px border, then rows; 20 between groups.
const DARK_TOP = 90 + 20 + 18 + 8 + 1;
const LIGHT_TOP = DARK_TOP + DARK.length * ROW_H + 1 + 20 + 18 + 8 + 1;
const CONTENT_H = LIGHT_TOP + LIGHT.length * ROW_H + 1;
const rowTop = (name) => DARK.includes(name) ? DARK_TOP + DARK.indexOf(name) * ROW_H : LIGHT_TOP + LIGHT.indexOf(name) * ROW_H;
let apSeq = 0;
class Component extends DCLogic {
  componentDidMount() { this.applyScroll(); }
  componentDidUpdate() { this.applyScroll(); }
  // Bring the chosen theme into view, as the real list should on open.
  applyScroll() {
    if (typeof document === "undefined") return;
    const el = document.querySelector('[data-ap-scroll="' + this.apId + '"]');
    if (el && typeof this.scrollY === "number") el.scrollTop = this.scrollY;
  }
  renderVals() {
    if (!this.apId) this.apId = "ap" + (++apSeq);
    const theme = THEMES[this.props.theme] ? this.props.theme : "Aura";
    const t = tokens(theme);
    const lineSoft = t.lineSoft;
    const lineInput = t.lineInput;
    const chosenDark = DARK.includes(theme) ? theme : "Sanctum Dark";
    const chosenLight = LIGHT.includes(theme) ? theme : "Sanctum Light";
    const hoverName = HOVER_FOR[theme] || "Cobalt2";
    const hover = PALETTES[hoverName];
    const rows = (names, chosen) => names.map((name, i) => {
      const on = name === chosen;
      const hov = name === hoverName;
      return {
        name, on, checked: on ? "true" : "false",
        nameStyle: "font-size: 13px; " + (on || hov ? "font-weight: 500; color: " + t.text : "color: " + t.text2),
        style: "display: flex; align-items: center; justify-content: space-between; gap: 12px; height: " + ROW_H + "px; flex-shrink: 0; box-sizing: border-box; padding: 0 14px; border: 0; " + (i < names.length - 1 ? "border-bottom: 1px solid " + lineSoft + ";" : "") + " text-align: left; background: " + (on ? t.sealedTint : hov ? lineSoft : "transparent")
      };
    });
    // Centre the current theme's row, clamped to the list's ends.
    const scrollY = Math.max(0, Math.min(CONTENT_H - VIEW_H, Math.round(rowTop(theme) + ROW_H / 2 - VIEW_H / 2)));
    this.scrollY = scrollY;
    const cx = 28 + 176 + 24 + 300; // the cursor, partway along the hovered row
    const cy = VIEW_TOP + rowTop(hoverName) - scrollY + 22;
    const above = cy - 196 - 8;
    return {
      t, lineSoft, lineInput,
      ...shellVals(t, theme, "Setup"),
      setupTabs: setupNav(t, "appearance"),
      ...tabInfo("appearance"),
      followSw: switchStyle(t, true),
      scrollId: this.apId,
      groups: [
        { title: "In dark mode", label: "Theme in dark mode", rows: rows(DARK, chosenDark) },
        { title: "In light mode", label: "Theme in light mode", rows: rows(LIGHT, chosenLight) }
      ],
      pv: { ...hover, name: hoverName, schemeLabel: hover.scheme === "light" ? "Light" : "Dark", sealedHex: hover.sealed, eventHex: hover.event, left: (cx + 18) + "px", top: (above >= 8 ? above : cy + 28) + "px" },
      cursor: { left: cx + "px", top: cy + "px" }
    };
  }
}
</script>
</body>

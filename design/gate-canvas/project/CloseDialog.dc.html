<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Close Sanctum</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
input{font:inherit}
input::placeholder{color:inherit;opacity:1}
h1,h2,h3{font-family:'Schibsted Grotesk', Geist, system-ui, sans-serif !important;font-weight: 700 !important;letter-spacing: -0.02em !important}
.nav-btn:hover,.hov:hover{opacity:.85}
/* The aurora: three radial lights, no blur filter. Still while open; only a sealed screen (.aurora-live) drifts, slowly. */
.aurora-a,.aurora-b,.aurora-c{position:absolute;border-radius:50%;transition:opacity 900ms ease}
.aurora-a{width:900px;height:760px;left:-300px;top:-340px}
.aurora-b{width:960px;height:800px;right:-360px;top:-280px}
.aurora-c{width:1200px;height:620px;left:12%;bottom:-420px}
.aurora-live .aurora-a{animation:auroraA 46s ease-in-out infinite}
.aurora-live .aurora-b{animation:auroraB 54s ease-in-out infinite}
.aurora-live .aurora-c{animation:auroraC 62s ease-in-out infinite}
@keyframes auroraA{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
@keyframes auroraB{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,24px)}}
@keyframes auroraC{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-24px)}}
@keyframes shellBreathe{0%,100%{opacity:1}50%{opacity:.45}}
.keyhole-breathe{animation:shellBreathe 3.2s ease-in-out infinite}
/* One focus ring for every control: 2px accent, 2px off the edge. */
.cd :is(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.cd *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="cd" style="--ring: {{t.sealed}}; position: relative; width: 100%; min-height: 800px; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, sans-serif; background: {{t.app}}; color: {{t.text}}">

  <nav aria-label="Sanctum" style="flex: 0 0 220px; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; background: {{t.sidebar}}; border-right: 1px solid {{t.line}}">
    <div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px; font-weight: 600; font-size: 14px">
      <svg width="20" height="20" viewBox="0 0 26 26" aria-hidden="true"><path d="M1.2 5.2Q13 3.3 24.8 5.2L24.4 8.6Q13 6.8 1.6 8.6Z" fill="{{t.text}}"></path><rect x="4.4" y="10.8" width="17.2" height="2.4" fill="{{t.text}}"></rect><rect x="6" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><rect x="16.8" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><g class="{{keyholeClass}}"><circle cx="13" cy="16.8" r="2.6" fill="{{t.sealed}}"></circle><path d="M12 17.97L11.1 24H14.9L14 17.97Z" fill="{{t.sealed}}"></path></g></svg>
      Sanctum
    </div>
    <div role="status" style="{{stateStyle}}">
      <span style="{{stateDot}}"></span>{{stateLabel}}
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <button type="button" class="nav-btn" aria-current="{{item.current}}" style="{{item.style}}">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{item.icon}}"><path d="{{item.d}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{keyColor}}">{{item.key}}</span>
        </button>
      </sc-for>
    </div>
  </nav>

  <main inert="" aria-hidden="true" style="position: relative; isolation: isolate; flex: 999 1 560px; min-width: 0; overflow: hidden; box-sizing: border-box; padding: 64px 56px; display: flex; flex-direction: column; gap: 14px">
    <div aria-hidden="true" class="{{auroraClass}}" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none">
      <div class="aurora-a" style="{{auroraA}}"></div>
      <div class="aurora-b" style="{{auroraB}}"></div>
      <div class="aurora-c" style="{{auroraC}}"></div>
      <div style="position: absolute; inset: 0; {{auroraVeil}}"></div>
    </div>
    <h1 style="margin: 0; font-size: 42px; line-height: 1.06">{{headline}}</h1>
    <p style="margin: 0; font-size: 15px; color: {{t.text2}}">{{fact}}</p>
    <div aria-hidden="true" style="position: relative; height: 22px; margin-top: 14px; border-bottom: 1px solid {{t.line}}">
      <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: {{fillPct}}; background: {{t.sealed}}"></div>
      <div style="position: absolute; left: 50%; bottom: 0; width: 2px; height: 22px; background: {{t.sec}}"></div>
    </div>
  </main>

  <!-- The scrim and the close dialog, over the whole window. -->
  <div style="position: absolute; inset: 0; background: {{scrim}}">
    <div role="dialog" aria-modal="true" aria-label="Close Sanctum" style="position: absolute; left: 50%; top: 170px; transform: translateX(-50%); width: 420px; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; border: 1px solid {{lineInput}}; background: {{t.panel}}; box-shadow: {{shadow}}">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 18px 18px 12px">
        <h1 style="margin: 0; font-size: 16px; letter-spacing: -0.01em !important">Close Sanctum</h1>
        <p style="margin: 0; font-size: 13px; color: {{t.muted}}">{{subtitle}}</p>
      </div>
      <div role="radiogroup" aria-label="On close" style="display: flex; flex-direction: column; gap: 6px; padding: 0 18px 14px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{o.checked}}" aria-disabled="{{o.disabled}}" style="{{o.style}}">
            <span aria-hidden="true" style="{{o.radio}}"><span style="{{o.dot}}"></span></span>
            <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
              <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500">{{o.title}}<span style="{{o.badge}}">{{o.badgeText}}</span></span>
              <span style="{{o.descStyle}}">{{o.desc}}</span>
            </span>
          </button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid {{t.line}}; background: {{footer}}">
        <button type="button" role="checkbox" aria-checked="true" class="hov" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0; border: 0; background: transparent; color: {{t.text2}}; font-size: 12px">
          <span aria-hidden="true" style="box-sizing: border-box; width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid {{t.sealed}}; background: {{t.sealed}}; color: {{t.sealedOn}}"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.2l2 2l4-4.4"></path></svg></span>
          Don't ask again
        </button>
        <button type="button" class="hov" style="margin-left: auto; height: 32px; padding: 0 12px; border: 1px solid {{lineInput}}; border-radius: 8px; background: transparent; color: {{t.text}}; font-size: 13px">Cancel</button>
        <button type="button" class="hov" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: {{t.sealed}}; color: {{t.sealedOn}}; font-size: 13px; font-weight: 600">Minimize<span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; opacity: .7">↵</span></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sealed":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["Aura","Night Owl","Cobalt2 Light","Sanctum Dark"],"default":"Aura"},"$preview":{"width":1280,"height":800}}'>
const THEMES = {
  "Aura": { scheme: "dark", app: "#15141B", sidebar: "#101015", panel: "#1E1D24", raised: "#28272D", line: "#3C3B41", lineInput: "#737277", text: "#EDECEE", text2: "#C6C5C8", muted: "#A2A1A4", sealed: "#FF6767", sealedOn: "#15141B", sealedText: "#FF6767", sealedTint: "#3D2228", sec: "#FFCA85", secText: "#FFCA85", secTint: "#382F2B", secLine: "#7E664B" },
  "Night Owl": { scheme: "dark", app: "#011627", sidebar: "#01111E", panel: "#0B1F30", raised: "#152938", line: "#273A4A", lineInput: "#647382", text: "#D6DEEB", text2: "#B0BAC8", muted: "#96A2B1", sealed: "#F78C6C", sealedOn: "#011627", sealedText: "#F78C6C", sealedTint: "#2B2A33", sec: "#ECC48D", secText: "#ECC48D", secTint: "#243036", secLine: "#6B6455" },
  "Cobalt2 Light": { scheme: "light", app: "#FFFFFF", sidebar: "#F2F2F2", panel: "#FFFFFF", raised: "#F5F5F5", line: "#D6DBDE", lineInput: "#7D8D98", text: "#193549", text2: "#4C6171", muted: "#5E6B74", sealed: "#237D89", sealedOn: "#FFFFFF", sealedText: "#007583", sealedTint: "#E9F2F3", sec: "#D68000", secText: "#8F5600", secTint: "#FBF4E8", secLine: "#F1D3A6" },
  "Sanctum Dark": { scheme: "dark", app: "#0B0D12", sidebar: "#0E1016", panel: "#12151C", raised: "#171B24", line: "#1F2430", lineInput: "#656973", text: "#E6E9EF", text2: "#B8BFCC", muted: "#8A93A6", sealed: "#2F5BFF", sealedOn: "#FFFFFF", sealedText: "#7A95FF", sealedTint: "#172040", sec: "#FF8A6B", secText: "#FF8A6B", secTint: "#2A1712", secLine: "#5A2E24" }
};
// Shared helpers, the same in every page file.
// muted and lineInput are contrast-checked in THEMES: muted clears 4.5:1 on app, panel, raised,
// sidebar, sealedTint and secTint; lineInput clears 3:1 on app, panel, raised and sidebar.
// Light themes come from the scheme field, never from the app colour.
function rgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); }
// mix(a, b, w): a moved toward b by w (0..1).
function mix(a, b, w) {
  const A = rgb(a), B = rgb(b);
  return "#" + A.map((v, i) => Math.round(v * (1 - w) + B[i] * w).toString(16).padStart(2, "0")).join("");
}
function tokens(name) {
  const base = THEMES[name] || THEMES.Aura;
  return { ...base, light: base.scheme === "light", lineSoft: mix(base.line, base.panel, 0.4) };
}
// The aurora: three radial lights, no blur filter. Barely there while open; a little stronger while sealed.
function auroraVals(t, sealed) {
  const o = sealed ? (t.light ? [0.14, 0.09, 0.06] : [0.28, 0.18, 0.12]) : (t.light ? [0.08, 0.08, 0.05] : [0.16, 0.14, 0.10]);
  const glow = (c, op) => "background: radial-gradient(closest-side, " + c + ", " + c + "00); opacity: " + op;
  return {
    auroraA: glow(t.sealed, o[0]),
    auroraB: glow(t.sec, o[1]),
    auroraC: glow(mix(t.sealed, t.sec, 0.5), o[2]),
    auroraVeil: "background: radial-gradient(ellipse 80% 70% at 50% 45%, " + t.app + "d9 0%, " + t.app + "a6 100%)",
    auroraClass: sealed ? "aurora-live" : ""
  };
}
const NAV = [
  ["Today", "Ctrl 1", "M8 1.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13Z M5.5 8l1.8 1.8L10.5 6.5"],
  ["Week", "Ctrl 2", "M2.5 3.5h11v10h-11Z M2.5 6.5h11 M5.5 2v3 M10.5 2v3"],
  ["Stats", "Ctrl 3", "M3 13V8 M8 13V3 M13 13V6"],
  ["Trackers", "Ctrl 4", "M2 12l4-4l3 3l5-6"],
  ["Notes", "Ctrl 5", "M4 1.5h5.5l2.5 2.5v10.5h-8Z M6 7h4 M6 10h4"],
  ["Journal", "Ctrl 6", "M3.5 2h8.5v12h-8.5Z M6 2v12"],
  ["Setup", "Ctrl ,", "M2 5h12 M2 11h12 M5 3v4 M11 9v4"]
];

// The app's sparkline (lib/trackers.ts), with its range widened to include the goal, so the
// dashed goal line always lands inside the 24px box.
function spark(vals, goal) {
  const lo = Math.min(goal, ...vals);
  const span = Math.max(goal, ...vals) - lo || 1;
  const y = (v) => 2 + (1 - (v - lo) / span) * 20;
  const x = (i) => 2 + i * (68 / (vals.length - 1));
  return {
    points: vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "),
    goalY: y(goal).toFixed(1),
    lastX: x(vals.length - 1).toFixed(1),
    lastY: y(vals[vals.length - 1]).toFixed(1)
  };
}

class Component extends DCLogic {
  renderVals() {
    const t = tokens(this.props.theme);
    const sealed = this.props.sealed !== false;
    const lineInput = t.lineInput;
    const checkLine = t.lineInput;
    const nav = NAV.map(([label, key, d], i) => {
      const on = i === 0;
      return {
        label, key, d,
        current: on ? "page" : "false",
        icon: on ? t.sec : t.muted,
        style: `display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; text-align: left; font-size: 13.5px; font-weight: ${on ? 600 : 400}; color: ${on ? t.text : t.text2}; background: ${on ? t.raised : "transparent"}`
      };
    });
    // Minimize is picked: the default, and the only choice while sealed.
    const options = [
      { id: "tray", title: "Minimize to tray", desc: "Keeps blocking, check-ins, and calendar sync running. Click the tray icon to reopen." },
      { id: "quit", title: "Quit Sanctum", desc: sealed ? "Opens at 4:12 PM. Quitting before then breaks the seal." : "Stops everything until you open it again or restart." }
    ].map((o) => {
      const on = o.id === "tray";
      const disabled = sealed && o.id === "quit";
      const mark = on && sealed;
      return {
        ...o,
        checked: on ? "true" : "false",
        disabled: disabled ? "true" : "false",
        style: `display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid ${on ? t.sealed + "66" : t.line}; background: ${on ? t.sealedTint : "transparent"}; color: ${disabled ? t.muted : t.text}; cursor: ${disabled ? "not-allowed" : "pointer"}`,
        radio: `margin-top: 1px; box-sizing: border-box; flex-shrink: 0; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; ${on ? `border: 1px solid ${t.sealed}; background: ${t.sealed}` : `border: 1.5px solid ${checkLine}`}`,
        dot: on ? `width: 6px; height: 6px; border-radius: 50%; background: ${t.sealedOn}` : "display: none",
        // Disabled: the title drops to muted (no opacity), so the reason with its time stays readable.
        descStyle: `font-size: 12px; color: ${t.muted}`,
        // While sealed, the tray option carries the seal's time left. Seal timing is the accent.
        badge: mark ? `display: inline-flex; align-items: center; margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 400; color: ${t.sealedText}` : "display: none",
        badgeText: mark ? "42:14 left" : ""
      };
    });
    return {
      t, nav, options, lineInput,
      headline: sealed ? "Nothing else until 4:12." : "Your word is the plan today.",
      fact: sealed ? "Sealed for Interview Prep until 4:12 PM." : "1h 18m left to reach today's 2 hours.",
      fillPct: sealed ? "30%" : "17.5%",
      subtitle: sealed ? "Quit opens at 4:12 PM. Until then, Sanctum keeps running in the tray." : "Choose what the close button does.",
      footer: mix(t.panel, t.app, 0.5),
      scrim: t.light ? "#19354952" : "#000000a8",
      shadow: `0 24px 64px ${t.light ? "#19354938" : "#0000008c"}`,
      keyColor: t.muted,
      keyholeClass: sealed ? "keyhole-breathe" : "",
      stateLabel: sealed ? "Sealed" : "Open",
      stateStyle: `display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid ${sealed ? t.sealed + "66" : t.line}; border-radius: 8px; font-size: 13px; font-weight: 500; color: ${sealed ? t.sealedText : t.text}; background: ${sealed ? t.sealedTint : "transparent"}`,
      stateDot: `width: 7px; height: 7px; border-radius: 50%; background: ${sealed ? t.sealed : t.text}`,
      ...auroraVals(t, sealed)
    };
  }
}
</script>
</body>
</html>

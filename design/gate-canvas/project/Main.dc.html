<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:'Schibsted Grotesk', Geist, system-ui, sans-serif !important;font-weight: 700 !important;letter-spacing: -0.02em !important}
.nav-btn:hover{opacity:.85}
.nav-btn{position:relative}
.nav-ico{transition:stroke 120ms cubic-bezier(.2,0,0,1)}
/* Keyboard focus: one visible ring on every interactive element. */
.proto-shell :is(button,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes shellBreathe{0%,100%{opacity:1}50%{opacity:.45}}
/* While sealed only the keyhole breathes; it starts once the enter moment has settled. */
.keyhole-breathe{animation:shellBreathe 3.2s cubic-bezier(.37,0,.63,1) 1s infinite}
.proto-shell.doc-hidden .keyhole-breathe{animation-play-state:paused}
/* The aurora behind every screen: three soft lights drawn as radial gradients (no filter pass), veiled toward the page colour.
   Open: near-still, a very slow small drift (.au-drift). Sealed: stronger, and the larger drift (.au-blob) runs too.
   The sealed drift pauses where it is when the seal ends, so nothing snaps back. Everything pauses while the document is hidden. */
.aurora{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.au-drift{position:absolute;will-change:transform}
.au-blob{position:absolute;inset:0;will-change:transform;transition:opacity 1200ms cubic-bezier(.37,0,.63,1);animation-play-state:paused}
.aurora.sealed .au-blob{animation-play-state:running}
.aurora.doc-hidden .au-drift,.aurora.doc-hidden .au-blob{animation-play-state:paused !important}
.au-da{width:820px;height:700px;left:-260px;top:-320px;animation:auDriftA 150s cubic-bezier(.37,0,.63,1) infinite}
.au-db{width:880px;height:740px;right:-320px;top:-240px;animation:auDriftB 170s cubic-bezier(.37,0,.63,1) infinite}
.au-dc{width:1120px;height:540px;left:12%;bottom:-390px;animation:auDriftC 190s cubic-bezier(.37,0,.63,1) infinite}
.au-a{animation:auroraA 46s cubic-bezier(.37,0,.63,1) infinite}
.au-b{animation:auroraB 54s cubic-bezier(.37,0,.63,1) infinite}
.au-c{animation:auroraC 62s cubic-bezier(.37,0,.63,1) infinite}
@keyframes auDriftA{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,18px)}}
@keyframes auDriftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,14px)}}
@keyframes auDriftC{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-16px)}}
@keyframes auroraA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,60px) scale(1.12)}}
@keyframes auroraB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-150px,46px) scale(.92)}}
@keyframes auroraC{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-90px,-46px) rotate(4deg)}}
/* Each screen draws on the aurora instead of a flat page colour. */
.proto-main .pt,.proto-main .ps-root,.proto-main .pt-root,.proto-main [data-proto-root]{background:transparent !important}

</style>

<div class="{{shellCls}}" ref="{{ rootRef }}" onKeyDown="{{ onKey }}" style="--accent: {{t.sealed}}; width: 100%; min-height: 800px; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, sans-serif; background: {{t.app}}; color: {{t.text}}">

    <div style="position: relative; display: flex; flex-direction: column; gap: 2px">
      <span data-nav-ind="" aria-hidden="true" style="{{navIndStyle}}"></span>
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <button type="button" class="nav-btn" data-nav-item="" aria-current="{{item.current}}" aria-disabled="{{item.disabled}}" title="{{item.hint}}" onClick="{{ item.go }}" style="{{item.style}}">

    </div>

      <div class="au-drift au-db"><div class="au-blob au-b" style="{{auroraB}}"></div></div>
      <div class="au-drift au-dc"><div class="au-blob au-c" style="{{auroraC}}"></div></div>
      <div style="position: absolute; inset: 0; {{auroraVeil}}"></div>
    </div>
    <div data-page="" style="flex: 1; display: flex; flex-direction: column; min-width: 0">
    <sc-if value="{{isToday}}" hint-placeholder-val="{{ true }}">
      <dc-import name="ProtoToday" app="{{app}}" hint-size="100%,800px"></dc-import>
    </sc-if>
    <sc-if value="{{isWeek}}" hint-placeholder-val="{{ false }}">
      <dc-import name="ProtoWeek" app="{{app}}" hint-size="100%,800px"></dc-import>
    </sc-if>
    <sc-if value="{{isStats}}" hint-placeholder-val="{{ false }}">
      <dc-import name="ProtoStats" app="{{app}}" hint-size="100%,800px"></dc-import>
    </sc-if>
    <sc-if value="{{isTrackers}}" hint-placeholder-val="{{ false }}">
      <dc-import name="ProtoTrackers" app="{{app}}" hint-size="100%,800px"></dc-import>
    </sc-if>
    </div>
  </main>
</div>
</x-dc>

      stateLabel: sealed ? "Sealed" : "Open",
      stateStyle: `display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid ${sealed ? t.sealed + "66" : t.line}; border-radius: 8px; font-size: 13px; font-weight: 500; color: ${sealed ? t.sealedText : t.text}; background: ${sealed ? t.sealedTint : "transparent"}; transition: background 400ms ease, border-color 400ms ease, color 400ms ease`,
      stateDot: `width: 7px; height: 7px; border-radius: 50%; background: ${sealed ? t.sealed : t.text}`
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sanctum Check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
input{font:inherit}
input::placeholder{color:inherit;opacity:1}
h1,h2,h3{font-family:'Schibsted Grotesk', Geist, system-ui, sans-serif !important;font-weight: 700 !important;letter-spacing: -0.02em !important}
.nav-btn:hover,.hov:hover{opacity:.85}
/* The aurora: three radial lights, no blur filter. Still while open; only a sealed screen (.aurora-live) drifts, slowly. */
.aurora-a,.aurora-b,.aurora-c{position:absolute;border-radius:50%;transition:opacity 900ms ease}
.aurora-a{width:900px;height:760px;left:-300px;top:-340px}
.aurora-b{width:960px;height:800px;right:-360px;top:-280px}
.aurora-c{width:1200px;height:620px;left:12%;bottom:-420px}
.aurora-live .aurora-a{animation:auroraA 46s ease-in-out infinite}
.aurora-live .aurora-b{animation:auroraB 54s ease-in-out infinite}
.aurora-live .aurora-c{animation:auroraC 62s ease-in-out infinite}
@keyframes auroraA{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
@keyframes auroraB{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,24px)}}
@keyframes auroraC{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-24px)}}
/* The dialog's body scrolls inside it; the header and the footer actions stay put. */
.ck .ck-body{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent;overscroll-behavior:contain}
.ck .ck-fade{position:absolute;left:0;right:8px;height:24px;pointer-events:none;transition:opacity 120ms cubic-bezier(.2,0,0,1)}
/* One focus ring for every control: 2px accent, 2px off the edge. */
.ck :is(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.ck *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="ck" style="--ring: {{t.sealed}}; --thumb: {{lineInput}}; position: relative; width: 100%; min-height: 720px; display: flex; flex-wrap: wrap; font-family: Geist, system-ui, sans-serif; background: {{t.app}}; color: {{t.text}}">

  <nav aria-label="Sanctum" style="flex: 0 0 220px; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; background: {{t.sidebar}}; border-right: 1px solid {{t.line}}">
    <div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px; font-weight: 600; font-size: 14px">
      <svg width="20" height="20" viewBox="0 0 26 26" aria-hidden="true"><path d="M1.2 5.2Q13 3.3 24.8 5.2L24.4 8.6Q13 6.8 1.6 8.6Z" fill="{{t.text}}"></path><rect x="4.4" y="10.8" width="17.2" height="2.4" fill="{{t.text}}"></rect><rect x="6" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><rect x="16.8" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><g><circle cx="13" cy="16.8" r="2.6" fill="{{t.sealed}}"></circle><path d="M12 17.97L11.1 24H14.9L14 17.97Z" fill="{{t.sealed}}"></path></g></svg>
      Sanctum
    </div>
    <div role="status" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid {{t.line}}; border-radius: 8px; font-size: 13px; font-weight: 500">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.text}}"></span>Open
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <button type="button" class="nav-btn" aria-current="{{item.current}}" style="{{item.style}}">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{item.icon}}"><path d="{{item.d}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{keyColor}}">{{item.key}}</span>
        </button>
      </sc-for>
    </div>
  </nav>

  <main inert="" aria-hidden="true" style="position: relative; isolation: isolate; flex: 999 1 560px; min-width: 0; overflow: hidden; box-sizing: border-box; padding: 64px 56px; display: flex; flex-direction: column; gap: 14px">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none">
      <div class="aurora-a" style="{{auroraA}}"></div>
      <div class="aurora-b" style="{{auroraB}}"></div>
      <div class="aurora-c" style="{{auroraC}}"></div>
      <div style="position: absolute; inset: 0; {{auroraVeil}}"></div>
    </div>
    <h1 style="margin: 0; font-size: 42px; line-height: 1.06">Your word is the plan today.</h1>
    <p style="margin: 0; font-size: 15px; color: {{t.text2}}">1h 18m left to reach today's 2 hours.</p>
    <div aria-hidden="true" style="position: relative; height: 22px; margin-top: 14px; border-bottom: 1px solid {{t.line}}">
      <div style="position: absolute; left: 0; bottom: -1px; height: 2px; width: 17.5%; background: {{t.sealed}}"></div>
      <div style="position: absolute; left: 50%; bottom: 0; width: 2px; height: 22px; background: {{t.sec}}"></div>
    </div>
  </main>

  <!-- The scrim and the check-in dialog, over the whole window.
       The dialog grew: 480 wide, 56 from the top, and up to the window's height less 112.
       At 800 high everything fits; at the 720 minimum (this artboard) the body scrolls, shown scrolled. -->
  <div style="position: absolute; inset: 0; background: {{scrim}}">
    <div role="dialog" aria-modal="true" aria-label="Evening check-in" style="position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: 480px; max-height: calc(100% - 112px); display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; border: 1px solid {{lineInput}}; background: {{t.panel}}; box-shadow: {{shadow}}">

      <div style="flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 16px 12px 18px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 18px">Evening check-in</h1>
          <span style="font-size: 12px; color: {{t.muted}}">Scheduled for <span style="font-family: 'Geist Mono', monospace">9:00 PM</span></span>
        </div>
        <button type="button" class="hov" aria-label="Close and ask again in 15 minutes" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"></path></svg>
        </button>
      </div>

      <!-- The scrolling body. A soft fade (from the panel colour) shows at the top or bottom edge only while there is more that way;
           the top fade carries the hairline the first row's border drew before it scrolled away. -->
      <div style="position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column">
      <div class="ck-body" ref="{{ bodyRef }}" onScroll="{{ onBodyScroll }}" tabindex="0" role="region" aria-label="Check-in questions" style="flex: 1 1 auto; min-height: 0; overflow-y: auto">
        <sc-for list="{{numbers}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid {{t.line}}">
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span style="font-size: 13px; font-weight: 500">{{r.name}}</span>
              <span style="font-size: 12px; color: {{t.muted}}">{{r.note}}</span>
            </div>
            <svg width="72" height="24" viewBox="0 0 72 24" aria-hidden="true" style="flex-shrink: 0; overflow: visible">
              <line x1="0" x2="72" y1="{{r.goalY}}" y2="{{r.goalY}}" stroke="{{t.sec}}" stroke-width="1" stroke-dasharray="3 3"></line>
              <polyline points="{{r.points}}" fill="none" stroke="{{t.sealed}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
              <circle cx="{{r.lastX}}" cy="{{r.lastY}}" r="2" fill="{{t.sealed}}"></circle>
            </svg>
            <div style="display: flex; align-items: center; flex-shrink: 0; overflow: hidden; border-radius: 8px; border: 1px solid {{lineInput}}">
              <button type="button" aria-label="{{r.dec}}" style="width: 32px; height: 32px; border: 0; background: {{t.raised}}; color: {{t.text2}}">−</button>
              <label style="width: 84px; display: flex; align-items: baseline; justify-content: center; gap: 4px">
                <input aria-label="{{r.name}}" inputmode="decimal" value="{{r.value}}" style="width: 52px; border: 0; background: transparent; text-align: right; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 500; color: {{t.text}}">
                <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{t.muted}}">{{r.unit}}</span>
              </label>
              <button type="button" aria-label="{{r.inc}}" style="width: 32px; height: 32px; border: 0; background: {{t.raised}}; color: {{t.text2}}">+</button>
            </div>
          </div>
        </sc-for>

        <div style="display: flex; flex-direction: column; gap: 14px; padding: 12px 18px; border-top: 1px solid {{t.line}}">
          <div style="display: flex; align-items: center; gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
              <span style="font-size: 13px; font-weight: 500">Mood</span>
              <span style="font-size: 12px; color: {{t.muted}}">Last: 7 / 10</span>
            </div>
            <svg width="72" height="24" viewBox="0 0 72 24" aria-hidden="true" style="flex-shrink: 0; overflow: visible">
              <line x1="0" x2="72" y1="{{mood.goalY}}" y2="{{mood.goalY}}" stroke="{{t.sec}}" stroke-width="1" stroke-dasharray="3 3"></line>
              <polyline points="{{mood.points}}" fill="none" stroke="{{t.sealed}}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
              <circle cx="{{mood.lastX}}" cy="{{mood.lastY}}" r="2" fill="{{t.sealed}}"></circle>
            </svg>
          </div>
          <div role="radiogroup" aria-label="Mood, 1 to 10" style="display: flex; justify-content: space-between">
            <sc-for list="{{scale}}" as="c" hint-placeholder-count="10">
              <button type="button" role="radio" aria-checked="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid {{t.line}}">
          <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
            <span style="font-size: 13px; font-weight: 500">Workout</span>
            <span style="font-size: 12px; color: {{t.muted}}">Last: No</span>
          </div>
          <div role="radiogroup" aria-label="Workout" style="display: flex; gap: 4px">
            <sc-for list="{{yesno}}" as="c" hint-placeholder-count="2">
              <button type="button" role="radio" aria-checked="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>

        <section aria-label="Goal review" style="display: flex; flex-direction: column; gap: 12px; padding: 12px 18px; border-top: 1px solid {{t.line}}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; color: {{t.muted}}">Still open today</span>
            <div style="display: flex; align-items: center; gap: 8px; height: 28px">
              <button type="button" role="checkbox" aria-checked="false" aria-label="Done: Read 20 pages" style="width: 15px; height: 15px; padding: 0; border-radius: 4px; border: 1.5px solid {{checkLine}}; background: transparent"></button>
              <span style="flex: 1; font-size: 13px">Read 20 pages</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; height: 28px">
              <button type="button" role="checkbox" aria-checked="false" aria-label="Done: Send the weekly update" style="width: 15px; height: 15px; padding: 0; border-radius: 4px; border: 1.5px solid {{checkLine}}; background: transparent"></button>
              <span style="flex: 1; font-size: 13px">Send the weekly update</span>
              <button type="button" class="hov" style="height: 26px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; font-size: 12px">Tomorrow</button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; color: {{t.muted}}">Tomorrow’s top 3</span>
            <sc-for list="{{tops}}" as="tp" hint-placeholder-count="3">
              <input aria-label="{{tp.label}}" value="{{tp.value}}" placeholder="{{tp.ph}}" style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid {{tp.border}}; background: {{t.raised}}; color: {{t.text}}; font-size: 13px">
            </sc-for>
          </div>
        </section>
      </div>
      <div aria-hidden="true" class="ck-fade" style="{{fadeTop}}"></div>
      <div aria-hidden="true" class="ck-fade" style="{{fadeBottom}}"></div>
      </div>

      <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid {{t.line}}; background: {{footer}}">
        <button type="button" class="hov" style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: {{t.muted}}; font-size: 13px">Skip today</button>
        <button type="button" class="hov" style="height: 32px; padding: 0 12px; border: 1px solid {{lineInput}}; border-radius: 8px; background: transparent; color: {{t.text}}; font-size: 13px">Snooze 15m</button>
        <button type="button" class="hov" style="margin-left: auto; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: {{t.sealed}}; color: {{t.sealedOn}}; font-size: 13px; font-weight: 600">Log<span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; opacity: .7">↵</span></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Aura","Night Owl","Cobalt2 Light","Sanctum Dark"],"default":"Aura"},"$preview":{"width":1280,"height":720}}'>
const THEMES = {
  "Aura": { scheme: "dark", app: "#15141B", sidebar: "#101015", panel: "#1E1D24", raised: "#28272D", line: "#3C3B41", lineInput: "#737277", text: "#EDECEE", text2: "#C6C5C8", muted: "#A2A1A4", sealed: "#FF6767", sealedOn: "#15141B", sealedText: "#FF6767", sealedTint: "#3D2228", sec: "#FFCA85", secText: "#FFCA85", secTint: "#382F2B", secLine: "#7E664B" },
  "Night Owl": { scheme: "dark", app: "#011627", sidebar: "#01111E", panel: "#0B1F30", raised: "#152938", line: "#273A4A", lineInput: "#647382", text: "#D6DEEB", text2: "#B0BAC8", muted: "#96A2B1", sealed: "#F78C6C", sealedOn: "#011627", sealedText: "#F78C6C", sealedTint: "#2B2A33", sec: "#ECC48D", secText: "#ECC48D", secTint: "#243036", secLine: "#6B6455" },
  "Cobalt2 Light": { scheme: "light", app: "#FFFFFF", sidebar: "#F2F2F2", panel: "#FFFFFF", raised: "#F5F5F5", line: "#D6DBDE", lineInput: "#7D8D98", text: "#193549", text2: "#4C6171", muted: "#5E6B74", sealed: "#237D89", sealedOn: "#FFFFFF", sealedText: "#007583", sealedTint: "#E9F2F3", sec: "#D68000", secText: "#8F5600", secTint: "#FBF4E8", secLine: "#F1D3A6" },
  "Sanctum Dark": { scheme: "dark", app: "#0B0D12", sidebar: "#0E1016", panel: "#12151C", raised: "#171B24", line: "#1F2430", lineInput: "#656973", text: "#E6E9EF", text2: "#B8BFCC", muted: "#8A93A6", sealed: "#2F5BFF", sealedOn: "#FFFFFF", sealedText: "#7A95FF", sealedTint: "#172040", sec: "#FF8A6B", secText: "#FF8A6B", secTint: "#2A1712", secLine: "#5A2E24" }
};
// Shared helpers, the same in every page file.
// muted and lineInput are contrast-checked in THEMES: muted clears 4.5:1 on app, panel, raised,
// sidebar, sealedTint and secTint; lineInput clears 3:1 on app, panel, raised and sidebar.
// Light themes come from the scheme field, never from the app colour.
function rgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); }
// mix(a, b, w): a moved toward b by w (0..1).
function mix(a, b, w) {
  const A = rgb(a), B = rgb(b);
  return "#" + A.map((v, i) => Math.round(v * (1 - w) + B[i] * w).toString(16).padStart(2, "0")).join("");
}
function tokens(name) {
  const base = THEMES[name] || THEMES.Aura;
  return { ...base, light: base.scheme === "light", lineSoft: mix(base.line, base.panel, 0.4) };
}
// The aurora: three radial lights, no blur filter. Barely there while open; a little stronger while sealed.
function auroraVals(t, sealed) {
  const o = sealed ? (t.light ? [0.14, 0.09, 0.06] : [0.28, 0.18, 0.12]) : (t.light ? [0.08, 0.08, 0.05] : [0.16, 0.14, 0.10]);
  const glow = (c, op) => "background: radial-gradient(closest-side, " + c + ", " + c + "00); opacity: " + op;
  return {
    auroraA: glow(t.sealed, o[0]),
    auroraB: glow(t.sec, o[1]),
    auroraC: glow(mix(t.sealed, t.sec, 0.5), o[2]),
    auroraVeil: "background: radial-gradient(ellipse 80% 70% at 50% 45%, " + t.app + "d9 0%, " + t.app + "a6 100%)",
    auroraClass: sealed ? "aurora-live" : ""
  };
}
const NAV = [
  ["Today", "Ctrl 1", "M8 1.5a6.5 6.5 0 1 0 0 13a6.5 6.5 0 1 0 0-13Z M5.5 8l1.8 1.8L10.5 6.5"],
  ["Week", "Ctrl 2", "M2.5 3.5h11v10h-11Z M2.5 6.5h11 M5.5 2v3 M10.5 2v3"],
  ["Stats", "Ctrl 3", "M3 13V8 M8 13V3 M13 13V6"],
  ["Trackers", "Ctrl 4", "M2 12l4-4l3 3l5-6"],
  ["Notes", "Ctrl 5", "M4 1.5h5.5l2.5 2.5v10.5h-8Z M6 7h4 M6 10h4"],
  ["Journal", "Ctrl 6", "M3.5 2h8.5v12h-8.5Z M6 2v12"],
  ["Setup", "Ctrl ,", "M2 5h12 M2 11h12 M5 3v4 M11 9v4"]
];

// The app's sparkline (lib/trackers.ts), with its range widened to include the goal, so the
// dashed goal line always lands inside the 24px box.
function spark(vals, goal) {
  const lo = Math.min(goal, ...vals);
  const span = Math.max(goal, ...vals) - lo || 1;
  const y = (v) => 2 + (1 - (v - lo) / span) * 20;
  const x = (i) => 2 + i * (68 / (vals.length - 1));
  return {
    points: vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "),
    goalY: y(goal).toFixed(1),
    lastX: x(vals.length - 1).toFixed(1),
    lastY: y(vals[vals.length - 1]).toFixed(1)
  };
}

// The artboard's scrolled state: the body opens this far down, so both fades show.
const SHOWN_SCROLL = 20;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Before measuring (and when rendered without a DOM), show the scrolled state: more above and below.
    this.state = { more: { up: true, down: true } };
    this.body = null;
    this.bodyRef = (el) => { this.body = el; };
    this.onBodyScroll = () => this.measure();
  }
  componentDidMount() {
    if (this.body) this.body.scrollTop = SHOWN_SCROLL;
    this.measure();
  }
  // A fade shows only while there is more to scroll that way.
  measure() {
    const el = this.body;
    if (!el) return;
    const up = el.scrollTop > 1;
    const down = el.scrollTop + el.clientHeight < el.scrollHeight - 1;
    const cur = (this.state && this.state.more) || {};
    if (cur.up !== up || cur.down !== down) this.setState({ ...(this.state || {}), more: { up, down } });
  }
  renderVals() {
    const more = (this.state && this.state.more) || { up: true, down: true };
    const t = tokens(this.props.theme);
    const lineInput = t.lineInput;
    const choice = (on, wide) => `height: 28px; ${wide ? "padding: 0 12px;" : "width: 28px; padding: 0;"} border-radius: 8px; font-family: 'Geist Mono', monospace; font-size: 12px; border: 1px solid ${on ? t.sealed : lineInput}; background: ${on ? t.sealed : "transparent"}; color: ${on ? t.sealedOn : t.text2}`;
    // History runs to Saturday; the draft is tonight's value, so the line ends on it.
    const numbers = [
      { name: "Sleep", unit: "h", value: "8", note: "+1.1 h since Saturday", vals: [7.2, 6.8, 8.1, 7.5, 8.0, 6.9, 8.0], goal: 8 },
      { name: "Weight", unit: "lb", value: "170.6", note: "−0.2 lb since Saturday", vals: [171.4, 171.2, 171.0, 171.1, 170.9, 170.8, 170.6], goal: 170 }
    ].map((r) => ({ ...r, ...spark(r.vals, r.goal), dec: `Decrease ${r.name}`, inc: `Increase ${r.name}` }));
    const nav = NAV.map(([label, key, d], i) => {
      const on = i === 0;
      return {
        label, key, d,
        current: on ? "page" : "false",
        icon: on ? t.sec : t.muted,
        style: `display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; text-align: left; font-size: 13.5px; font-weight: ${on ? 600 : 400}; color: ${on ? t.text : t.text2}; background: ${on ? t.raised : "transparent"}`
      };
    });
    const tops = ["Mock interview, round two", "", ""];
    return {
      t, nav, numbers, lineInput,
      bodyRef: this.bodyRef,
      onBodyScroll: this.onBodyScroll,
      fadeTop: `top: 0; border-top: 1px solid ${t.line}; background: linear-gradient(${t.panel}, ${t.panel}00); opacity: ${more.up ? 1 : 0}`,
      fadeBottom: `bottom: 0; background: linear-gradient(${t.panel}00, ${t.panel}); opacity: ${more.down ? 1 : 0}`,
      mood: spark([6, 7, 7, 5, 8, 7, 7], 7),
      scale: Array.from({ length: 10 }, (_, i) => ({ label: String(i + 1), on: i + 1 === 7 ? "true" : "false", style: choice(i + 1 === 7, false) })),
      yesno: [["Yes", true], ["No", false]].map(([label, on]) => ({ label, on: on ? "true" : "false", style: choice(on, true) })),
      tops: tops.map((v, n) => ({ value: v, label: `Tomorrow ${n + 1}`, ph: `${n + 1}.`, border: n === 1 ? t.sealed : lineInput })),
      checkLine: lineInput,
      footer: mix(t.panel, t.app, 0.5),
      scrim: t.light ? "#19354952" : "#000000a8",
      shadow: `0 24px 64px ${t.light ? "#19354938" : "#0000008c"}`,
      keyColor: t.muted,
      ...auroraVals(t, false)
    };
  }
}
</script>
</body>
</html>

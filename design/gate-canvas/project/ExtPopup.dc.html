<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Extension Popup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
/* Headlines: Schibsted Grotesk 700, one plain sentence, no italic payoff (Instrument Serif and h1 em are gone).
   The real extension bundles Schibsted Grotesk (and Geist, Geist Mono) as local woff2 files with @font-face,
   because the blocked page and the popup can't load Google Fonts. The link above is only for this canvas. */
h1,h2,h3{font-family:'Schibsted Grotesk', Geist, system-ui, sans-serif !important;font-weight: 700 !important;letter-spacing: -0.02em !important}
.pop-btn:hover{filter:brightness(1.08)}
.pop-stage :is(button,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--ring) !important;outline-offset:2px}
@keyframes shellBreathe{0%,100%{opacity:1}50%{opacity:.45}}
.keyhole-breathe{animation:shellBreathe 3.2s ease-in-out infinite}
/* The aurora, scaled to a 300px popup. */
.aurora-a,.aurora-b,.aurora-c{position:absolute;border-radius:50%;filter:blur(54px);transition:opacity 900ms ease, background 900ms ease;will-change:transform}
.aurora-a{width:220px;height:170px;left:-90px;top:-100px;animation:auroraA 46s ease-in-out infinite}
.aurora-b{width:240px;height:180px;right:-130px;top:-70px;animation:auroraB 54s ease-in-out infinite}
.aurora-c{width:320px;height:130px;left:8%;bottom:-110px;border-radius:45%;animation:auroraC 62s ease-in-out infinite}
@keyframes auroraA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,24px) scale(1.15)}}
@keyframes auroraB{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-60px,20px) scale(.9)}}
@keyframes auroraC{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(-36px,-18px) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){.pop-stage *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="pop-stage" style="width: 100%; min-height: 248px; box-sizing: border-box; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; font-family: Geist, system-ui, sans-serif; background: {{t.sidebar}}; color: {{t.text}}; --ring: {{t.sealed}}">

  <!-- Sealed -->
  <main aria-label="Sanctum popup, sealed" style="{{popStyle}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none">
      <div class="aurora-a" style="{{auroraASealed}}"></div>
      <div class="aurora-b" style="{{auroraB}}"></div>
      <div class="aurora-c" style="{{auroraC}}"></div>
      <div style="position: absolute; inset: 0; {{auroraVeil}}"></div>
    </div>
    <header style="{{headStyle}}">
      <svg width="16" height="16" viewBox="0 0 26 26" aria-hidden="true"><path d="M1.2 5.2Q13 3.3 24.8 5.2L24.4 8.6Q13 6.8 1.6 8.6Z" fill="{{t.text}}"></path><rect x="4.4" y="10.8" width="17.2" height="2.4" fill="{{t.text}}"></rect><rect x="6" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><rect x="16.8" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><g class="keyhole-breathe"><circle cx="13" cy="16.8" r="2.6" fill="{{t.sealed}}"></circle><path d="M12 17.97L11.1 24H14.9L14 17.97Z" fill="{{t.sealed}}"></path></g></svg>
      <span style="font-weight: 600">Sanctum</span>
      <span style="{{pillSealed}}"><span style="{{dotSealed}}"></span>Sealed</span>
    </header>
    <section style="display: flex; flex-direction: column; gap: 4px; padding: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span role="timer" style="font-family: 'Geist Mono', monospace; font-size: 30px; font-weight: 500; letter-spacing: -0.03em; color: {{t.sealedText}}">38:12</span>
        <!-- The seal's planned end: seal timing, so its tick is the accent. -->
        <span style="display: flex; align-items: center; gap: 7px; color: {{t.text2}}; line-height: 1.45"><span aria-hidden="true" style="{{goalTick}}"></span>until 4:30 PM</span>
      </div>
      <span style="color: {{t.text2}}; line-height: 1.45">Interview Prep</span>
      <span style="font-size: 12px; color: {{t.muted}}">3 sites and 1 keyword sealed</span>
    </section>
    <footer style="{{footStyle}}">
      <span style="{{connStyle}}"><span style="{{connDot}}"></span>Connected to Sanctum</span>
      <button type="button" class="pop-btn" style="{{btnStyle}}">Open Sanctum</button>
    </footer>
  </main>

  <!-- Open -->
  <main aria-label="Sanctum popup, open" style="{{popStyle}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none">
      <div class="aurora-a" style="{{auroraAOpen}}"></div>
      <div class="aurora-b" style="{{auroraB}}"></div>
      <div class="aurora-c" style="{{auroraC}}"></div>
      <div style="position: absolute; inset: 0; {{auroraVeil}}"></div>
    </div>
    <header style="{{headStyle}}">
      <svg width="16" height="16" viewBox="0 0 26 26" aria-hidden="true"><path d="M1.2 5.2Q13 3.3 24.8 5.2L24.4 8.6Q13 6.8 1.6 8.6Z" fill="{{t.text}}"></path><rect x="4.4" y="10.8" width="17.2" height="2.4" fill="{{t.text}}"></rect><rect x="6" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><rect x="16.8" y="7.4" width="3.2" height="16.6" fill="{{t.text}}"></rect><circle cx="13" cy="16.8" r="2.6" fill="{{t.sealed}}"></circle><path d="M12 17.97L11.1 24H14.9L14 17.97Z" fill="{{t.sealed}}"></path></svg>
      <span style="font-weight: 600">Sanctum</span>
      <span style="{{pillOpen}}"><span style="{{dotOpen}}"></span>Open</span>
    </header>
    <section style="display: flex; flex-direction: column; gap: 4px; padding: 14px">
      <h1 style="margin: 0; font-size: 16px; line-height: 1.25; color: {{t.text}}">Nothing is sealed.</h1>
      <span style="color: {{t.text2}}; line-height: 1.45">Start focus in Sanctum and the sites you flagged are blocked here.</span>
    </section>
    <footer style="{{footStyle}}">
      <span style="{{connStyle}}"><span style="{{connDot}}"></span>Connected to Sanctum</span>
      <button type="button" class="pop-btn" style="{{btnStyle}}">Open Sanctum</button>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Aura","Night Owl","Cobalt2 Light","Sanctum Dark"],"default":"Aura"},"$preview":{"width":672,"height":248}}'>
const THEMES = {
  "Aura": { scheme: "dark", app: "#15141B", sidebar: "#101015", panel: "#1E1D24", raised: "#28272D", line: "#3C3B41", text: "#EDECEE", text2: "#C6C5C8", muted: "#A2A1A4", sealed: "#FF6767", sealedOn: "#15141B", sealedText: "#FF6767", sealedTint: "#3D2228", sec: "#FFCA85", secText: "#FFCA85", secTint: "#382F2B", secLine: "#7E664B" },
  "Night Owl": { scheme: "dark", app: "#011627", sidebar: "#01111E", panel: "#0B1F30", raised: "#152938", line: "#273A4A", text: "#D6DEEB", text2: "#B0BAC8", muted: "#96A2B1", sealed: "#F78C6C", sealedOn: "#011627", sealedText: "#F78C6C", sealedTint: "#2B2A33", sec: "#ECC48D", secText: "#ECC48D", secTint: "#243036", secLine: "#6B6455" },
  "Cobalt2 Light": { scheme: "light", app: "#FFFFFF", sidebar: "#F2F2F2", panel: "#FFFFFF", raised: "#F5F5F5", line: "#D6DBDE", text: "#193549", text2: "#4C6171", muted: "#5E6B74", sealed: "#237D89", sealedOn: "#FFFFFF", sealedText: "#007583", sealedTint: "#E9F2F3", sec: "#D68000", secText: "#8F5600", secTint: "#FBF4E8", secLine: "#F1D3A6" },
  "Sanctum Dark": { scheme: "dark", app: "#0B0D12", sidebar: "#0E1016", panel: "#12151C", raised: "#171B24", line: "#1F2430", text: "#E6E9EF", text2: "#B8BFCC", muted: "#8A93A6", sealed: "#2F5BFF", sealedOn: "#FFFFFF", sealedText: "#7A95FF", sealedTint: "#172040", sec: "#FF8A6B", secText: "#FF8A6B", secTint: "#2A1712", secLine: "#5A2E24" }
};
// muted is raised to pass 4.5:1 on every surface here, the aurora's worst edge included
// (Aura #9B9A9E, Night Owl #8592A1 and Cobalt2 Light #66747D failed on raised, sealedTint or the aurora).
// Light themes are told by scheme, never by the app colour.
// Tokens the extension receives from the app as well (theme.js sets each as a CSS variable).
// lineInput reaches 3:1 on app, panel and raised. No "open" hue: the open state is neutral.
const EXTRA = {
  "Aura": { sealedLine: "#7E393D", lineInput: "#737277", panelFooter: "#1A1920" },
  "Night Owl": { sealedLine: "#704B46", lineInput: "#647382", panelFooter: "#061B2C" },
  "Cobalt2 Light": { sealedLine: "#B2D2D6", lineInput: "#7D8D98", panelFooter: "#FFFFFF" },
  "Sanctum Dark": { sealedLine: "#1F3482", lineInput: "#656973", panelFooter: "#0F1218" }
};

class Component extends DCLogic {
  renderVals() {
    const theme = THEMES[this.props.theme] ? this.props.theme : "Aura";
    const t = { ...THEMES[theme], ...EXTRA[theme] };
    const light = t.scheme === "light";
    const pill = (on) => `margin-left: auto; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 5px; font-size: 11px; border: 1px solid ${on ? t.sealedLine : t.lineInput}; background: ${on ? t.sealedTint : "transparent"}; color: ${on ? t.text : t.text2}`;
    return {
      t,
      popStyle: `position: relative; isolation: isolate; flex: 0 0 300px; width: 300px; display: flex; flex-direction: column; overflow: hidden; font-size: 13px; background: ${t.panel}; border: 1px solid ${t.line}; border-radius: 12px; box-shadow: 0 14px 32px ${light ? "#19354926" : "#00000080"}`,
      auroraASealed: `background: ${t.sealed}; opacity: ${light ? 0.14 : 0.28}`,
      auroraAOpen: `background: ${t.sealed}; opacity: ${light ? 0.08 : 0.16}`,
      auroraB: `background: ${t.sec}; opacity: ${light ? 0.08 : 0.14}`,
      auroraC: `background: linear-gradient(120deg, ${t.sealed}, ${t.sec}); opacity: ${light ? 0.05 : 0.1}`,
      auroraVeil: `background: radial-gradient(ellipse 80% 70% at 50% 45%, ${t.panel}d9 0%, ${t.panel}a6 100%)`,
      headStyle: `display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px 0 14px; border-bottom: 1px solid ${t.line}`,
      pillSealed: pill(true),
      pillOpen: pill(false),
      dotSealed: `width: 6px; height: 6px; border-radius: 50%; background: ${t.sealed}`,
      // Open is neutral: a hollow dot in the muted colour.
      dotOpen: `box-sizing: border-box; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid ${t.muted}`,
      goalTick: `display: inline-block; width: 2px; height: 11px; border-radius: 1px; background: ${t.sealed}`,
      footStyle: `display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-top: 1px solid ${t.line}; background: ${t.panelFooter}`,
      connStyle: `display: flex; align-items: center; gap: 6px; font-size: 11px; color: ${t.muted}`,
      // Connected is a fact, not a state: neutral.
      connDot: `width: 6px; height: 6px; border-radius: 50%; background: ${t.text2}`,
      btnStyle: `margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid ${t.lineInput}; border-radius: 8px; background: ${t.raised}; color: ${t.text}; font-size: 12px`
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sanctum held</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#FFFFFF}a:hover{color:#D6E4FF}
button{font-family:inherit}
@keyframes blobA{0%{transform:translate(0,0) scale(1)}33%{transform:translate(180px,90px) scale(1.2)}66%{transform:translate(60px,-60px) scale(0.9)}100%{transform:translate(0,0) scale(1)}}
@keyframes blobB{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-220px,40px) scale(0.85)}100%{transform:translate(0,0) scale(1.1)}}
@keyframes blobC{0%{transform:translate(0,0)}50%{transform:translate(120px,-140px) scale(1.15)}100%{transform:translate(0,0)}}
@keyframes blobD{0%{transform:translate(0,0) scale(0.9)}50%{transform:translate(-100px,-80px) scale(1.2)}100%{transform:translate(0,0) scale(0.9)}}
@keyframes drawArch{from{stroke-dashoffset:50}to{stroke-dashoffset:0}}
@keyframes drawBase{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
@keyframes dropDot{0%{opacity:0;transform:translateY(-7px)}60%{opacity:1;transform:translateY(1px)}100%{opacity:1;transform:translateY(0)}}
@keyframes kLeg{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes kBeam{from{opacity:0;transform:translateY(-4px) scaleX(.6)}to{opacity:1;transform:none}}
@keyframes kNuki{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kKey{0%{opacity:0;transform:translateY(-5px) scale(.7)}60%{opacity:1;transform:translateY(.6px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes kBreathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.86)}}
.k-leg{transform-box:fill-box;transform-origin:bottom;animation:kLeg .5s cubic-bezier(.3,.8,.2,1) both}
.k-leg2{animation-delay:.08s}
.k-beam{transform-box:fill-box;transform-origin:center;animation:kBeam .5s .35s cubic-bezier(.2,.8,.2,1) both}
.k-nuki{transform-box:fill-box;transform-origin:center;animation:kNuki .4s .6s cubic-bezier(.2,.8,.2,1) both}
.k-key{transform-box:fill-box;transform-origin:center;animation:kKey .5s .95s cubic-bezier(.3,1.4,.5,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mg-a{animation:blobA 14s ease-in-out infinite}.mg-b{animation:blobB 17s ease-in-out infinite}.mg-c{animation:blobC 19s ease-in-out infinite}.mg-d{animation:blobD 15s ease-in-out infinite}
.lg-arch{stroke-dasharray:50;animation:drawArch 1.1s cubic-bezier(.6,0,.2,1) both}
.lg-base{stroke-dasharray:22;animation:drawBase .5s .9s cubic-bezier(.6,0,.2,1) both}
.lg-dot{transform-box:fill-box;transform-origin:center;animation:dropDot .45s 1.25s cubic-bezier(.3,1.4,.5,1) both}
.r1{animation:rise .8s 1.3s cubic-bezier(.2,.7,.2,1) both}.r2{animation:rise .8s 1.45s cubic-bezier(.2,.7,.2,1) both}.r3{animation:rise .8s 1.6s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){.mg-a,.mg-b,.mg-c,.mg-d,.k-leg,.k-beam,.k-nuki,.k-key,.r1,.r2,.r3{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 1120px; height: 720px; overflow: hidden; background: #0B0D12; font-family: 'Geist', system-ui, sans-serif; color: #FFFFFF">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1120px; height: 720px; overflow: hidden">
<div class="mg-a" style="position: absolute; left: -160px; top: -200px; width: 680px; height: 680px; border-radius: 999px; background: {{c1}}; filter: blur(120px); opacity: 0.9"></div>
<div class="mg-b" style="position: absolute; right: -200px; top: -80px; width: 700px; height: 700px; border-radius: 999px; background: {{c2}}; filter: blur(130px); opacity: 0.8"></div>
<div class="mg-c" style="position: absolute; left: 260px; bottom: -380px; width: 720px; height: 720px; border-radius: 999px; background: {{c3}}; filter: blur(130px); opacity: 0.85"></div>
<div class="mg-d" style="position: absolute; right: 120px; bottom: -200px; width: 460px; height: 460px; border-radius: 999px; background: {{c4}}; filter: blur(110px); opacity: 0.7"></div>
<div style="position: absolute; left: 0; top: 0; width: 1120px; height: 720px; background: radial-gradient(ellipse 70% 60% at 50% 48%, rgba(11,13,18,0.1) 0%, rgba(11,13,18,0.55) 100%)"></div>
<svg width="1120" height="720" style="position: absolute; left: 0; top: 0; opacity: 0.09; mix-blend-mode: overlay"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="1120" height="720" filter="url(#grain)"></rect></svg>
</div>

<div style="position: relative; width: 1120px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px">
<sc-if value="{{show}}" hint-placeholder-val="{{true}}">
<svg width="96" height="96" viewBox="0 0 26 26" fill="none" role="img" aria-label="Sanctum"><path class="k-beam" d="M1.2 5.2Q13 3.3 24.8 5.2L24.4 8.6Q13 6.8 1.6 8.6Z" fill="#FFFFFF"></path><rect class="k-nuki" x="4.4" y="10.8" width="17.2" height="2.4" fill="#FFFFFF"></rect><rect class="k-leg" x="6" y="7.4" width="3.2" height="16.6" fill="#FFFFFF"></rect><rect class="k-leg k-leg2" x="16.8" y="7.4" width="3.2" height="16.6" fill="#FFFFFF"></rect><g class="k-key"><circle cx="13" cy="16.8" r="2.6" fill="#FFFFFF"></circle><path d="M12 17.97L11.1 24H14.9L14 17.97Z" fill="#FFFFFF"></path></g></svg>
<div class="r1" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<span style="font-size: 13px; letter-spacing: 0.08em; color: rgba(255,255,255,0.85)">INTERVIEW PREP · 60 MIN</span>
<h1 style="margin: 0; font-weight: 700; font-size: 88px; line-height: 1; letter-spacing: -0.04em">Sanctum <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.12em; letter-spacing: -0.01em; color: rgba(255,255,255,0.86)">held.</span></h1>
<p style="margin: 0; font-size: 17px; color: rgba(255,255,255,0.9)">6 days straight. Promise kept.</p>
</div>
<div class="r2" style="display: flex; border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; background: rgba(11,13,18,0.35); overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 22px; border-right: 1px solid rgba(255,255,255,0.12)"><span style="font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500">58m</span><span style="font-size: 12px; color: rgba(255,255,255,0.72)">in focus</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 22px; border-right: 1px solid rgba(255,255,255,0.12)"><span style="font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500">3</span><span style="font-size: 12px; color: rgba(255,255,255,0.72)">attempts blocked</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 22px"><span style="font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500">2h 40m</span><span style="font-size: 12px; color: rgba(255,255,255,0.72)">today, goal hit</span></div>
</div>
<div class="r3" style="display: flex; gap: 8px">
<button onClick="{{replay}}" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: rgba(11,13,18,0.35); border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; color: #FFFFFF; font-size: 13px; cursor: pointer">Replay</button>
<a href="Home.dc.html" style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; font-size: 13px; text-decoration: none; color: #FFFFFF">Done<span style="font-family: 'Geist Mono', monospace; font-size: 11px; opacity: 0.7">Esc</span></a>
<a href="HomeFocus.dc.html" style="height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #FFFFFF; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; color: #0B0D12">Enter again<span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; opacity: 0.6">↵</span></a>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["Current blue","Cobalt","Command red","Brass","Steel"],"default":"Cobalt"},"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true };
  }
  chime() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const master = ctx.createGain(); master.gain.value = 0.22; master.connect(ctx.destination);
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const t = ctx.currentTime + 1.2 + i * 0.11;
      ['sine', 'triangle'].forEach((type, j) => {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = type; o.frequency.value = j === 0 ? f : f * 2;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(j === 0 ? 0.9 : 0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.7);
      });
    });
    setTimeout(() => ctx.close(), 3800);
  }
  renderVals() {
    const sets = {
      'Current blue': ['#3D5AFE', '#37C8D6', '#8B6CFF', '#5B8CFF'],
      'Cobalt': ['#1F3FD9', '#2F5BFF', '#6A4CFF', '#12A8C9'],
      'Command red': ['#B3202A', '#E5484D', '#5A1A8F', '#FF7A45'],
      'Brass': ['#8A6420', '#C9A24A', '#5C3B14', '#E8C77A'],
      'Steel': ['#3A4155', '#8A93A6', '#1F2430', '#C9CED8']
    };
    const [c1, c2, c3, c4] = sets[this.props.palette ?? 'Cobalt'] || sets['Current blue'];
    return {
      c1, c2, c3, c4, show: this.state.show,
      replay: () => { this.chime(); this.setState({ show: false }); setTimeout(() => this.setState({ show: true }), 30); }
    };
  }
}
</script>
</body>
</html>

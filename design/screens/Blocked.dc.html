<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sealed app intercept</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1120px; height: 720px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #E6E9EF">
<dc-import name="Home" mode="focus" hint-size="1120px,720px"></dc-import>
<div style="position: absolute; left: 0; top: 0; width: 1120px; height: 720px; background: rgba(5,6,10,0.72)"></div>

<div role="alertdialog" aria-label="Discord is sealed" style="position: absolute; left: 350px; top: 170px; width: 420px; box-sizing: border-box; display: flex; flex-direction: column; background: #12151C; border: 1px solid #1F3482; border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,0.6); overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 18px">
<div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #172040; border: 1px solid #1F3482">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: -0.03em">Discord stays <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.12em; letter-spacing: -0.01em; color: #8C96AB">sealed.</span></h1>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #B8BFCC">18 minutes into Interview Prep, <span style="font-family: 'Geist Mono', monospace; color: #E6E9EF">32:14</span> to go. You don't need it. You need the reps.</p>
</div>
<div style="display: flex; gap: 16px; font-size: 12px; color: #8A93A6">
<span>3rd attempt this session</span><span>Logged to stats</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-top: 1px solid #1F2430; background: #0F1218">
<button style="height: 32px; padding: 0 10px; background: transparent; border: none; border-radius: 6px; color: #8A93A6; font-size: 13px; cursor: pointer">Break the seal</button>
<span style="margin-left: auto; font-size: 12px; color: #5C6477">Returning in <span style="font-family: 'Geist Mono', monospace">5s</span></span>
<button style="height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #2F5BFF; border: none; border-radius: 6px; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Back to VS Code<span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; opacity: 0.7">↵</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

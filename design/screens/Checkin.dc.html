<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sanctum check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#7A95FF}a:hover{color:#A9BBFF}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1120px; height: 720px; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #E6E9EF">
<dc-import name="Home" mode="idle" hint-size="1120px,720px"></dc-import>
<div style="position: absolute; left: 0; top: 0; width: 1120px; height: 720px; background: rgba(5,6,10,0.66)"></div>

<div role="dialog" aria-label="Morning weigh-in" style="position: absolute; left: 340px; top: 150px; width: 440px; box-sizing: border-box; display: flex; flex-direction: column; background: #12151C; border: 1px solid #2A3040; border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,0.55); overflow: hidden">
<div style="display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 16px 12px 18px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #8A93A6">Scheduled check-in · 8:00 AM</span>
<h1 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em">Morning weigh-in</h1>
</div>
<button aria-label="Close" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 6px; color: #8A93A6; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<sc-for list="{{metrics}}" as="m" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid #1F2430">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 13px; font-weight: 500">{{m.label}}</span>
<span style="font-size: 12px; color: #8A93A6">{{m.delta}}</span>
</div>
<svg width="72" height="24" viewBox="0 0 72 24" aria-hidden="true"><polyline points="{{m.spark}}" fill="none" stroke="#2F5BFF" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
<div style="display: flex; align-items: center; border: 1px solid #2A3040; border-radius: 6px; overflow: hidden">
<button onClick="{{m.dec}}" aria-label="{{m.decLabel}}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #171B24; border: none; color: #B8BFCC; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="width: 84px; text-align: center; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 500">{{m.value}}<span style="font-size: 11px; color: #8A93A6"> {{m.unit}}</span></span>
<button onClick="{{m.inc}}" aria-label="{{m.incLabel}}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #171B24; border: none; color: #B8BFCC; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
</sc-for>

<div style="display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid #1F2430; background: #0F1218">
<button style="height: 32px; padding: 0 10px; background: transparent; border: none; border-radius: 6px; color: #8A93A6; font-size: 13px; cursor: pointer">Skip today</button>
<button style="height: 32px; padding: 0 10px; background: transparent; border: 1px solid #2A3040; border-radius: 6px; color: #B8BFCC; font-size: 13px; cursor: pointer">Snooze 15m</button>
<a href="Tracking.dc.html" style="margin-left: auto; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #2F5BFF; border-radius: 6px; color: #FFFFFF; font-size: 13px; font-weight: 600; text-decoration: none">Log<span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; opacity: 0.7">↵</span></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { weight: 172.4, bf: 15.8 };
  }
  spark(vals) {
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    return vals.map((v, i) => (2 + i * (68 / (vals.length - 1))).toFixed(1) + ',' + (2 + (1 - (v - lo) / span) * 20).toFixed(1)).join(' ');
  }
  renderVals() {
    const r1 = (x) => Math.round(x * 10) / 10;
    const w = this.state.weight, b = this.state.bf;
    const mk = (label, key, value, unit, hist, prev) => {
      const d = r1(value - prev);
      return {
        label, unit, value: value.toFixed(1),
        delta: (d > 0 ? '+' : '') + d + (unit === '%' ? ' pts' : ' ' + unit) + ' since Thursday',
        spark: this.spark(hist.concat([value])),
        dec: () => this.setState({ [key]: r1(this.state[key] - 0.1) }), inc: () => this.setState({ [key]: r1(this.state[key] + 0.1) }),
        decLabel: 'Decrease ' + label, incLabel: 'Increase ' + label
      };
    };
    return { metrics: [
      mk('Weight', 'weight', w, 'lb', [176.2, 175.8, 175.1, 174.6, 174.0, 173.5, 173.0], 173.0),
      mk('Body fat', 'bf', b, '%', [17.1, 16.9, 16.7, 16.5, 16.4, 16.2, 16.0], 16.0)
    ] };
  }
}
</script>
</body>
</html>

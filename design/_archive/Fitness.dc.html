<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sanctum fitness trends</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@300;400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#0A0C12;color:#E8ECF4}
a{color:#6E9BFF}a:hover{color:#9DBBFF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 720px; box-sizing: border-box; background: #0A0C12; color: #E8ECF4; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 24px 28px 28px">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 14px">
<a href="Today.dc.html" style="font-size: 13px; color: #9AA3B5; text-decoration: none">Today /</a>
<h1 style="margin: 0; font-family: 'Geist', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.035em; font-size: 34px; line-height: 1.05">Fitness <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: -0.01em; color: #8C96AB">numbers</span></h1>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<div role="group" aria-label="Time range" style="display: flex; gap: 2px; padding: 3px; background: #11141C; border: 1px solid #1B2030; border-radius: 12px">
<sc-for list="{{ranges}}" as="r" hint-placeholder-count="5">
<button onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="View" style="display: flex; gap: 2px; padding: 3px; background: #11141C; border: 1px solid #1B2030; border-radius: 12px">
<sc-for list="{{views}}" as="v" hint-placeholder-count="2">
<button onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="{{v.style}}">{{v.label}}</button>
</sc-for>
</div>
<a href="Checkin.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 16px; background: #6E9BFF; border-radius: 12px; color: #0A0C12; font-size: 14px; font-weight: 600; text-decoration: none">Log now</a>
</div>
</header>

<sc-if value="{{showChart}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 12px">
<sc-for list="{{charts}}" as="c" hint-placeholder-count="2">
<section style="flex: 1 1 0; display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 14px; background: #11141C; border: 1px solid #1B2030; border-radius: 18px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 13px; font-weight: 500; color: #9AA3B5">{{c.title}}</h2>
<span style="font-family: 'Geist Mono', monospace; font-weight: 300; font-size: 34px; line-height: 1">{{c.current}}<span style="font-size: 14px; color: #9AA3B5"> {{c.unit}}</span></span>
</div>
<span style="font-size: 13px; color: #CBD2E0">{{c.change}}</span>
</div>
<div style="position: relative; width: 490px; height: 220px">
<svg width="490" height="220" viewBox="0 0 490 220" aria-label="{{c.aria}}" role="img">
<sc-for list="{{c.grid}}" as="g" hint-placeholder-count="3">
<line x1="40" x2="486" y1="{{g.y}}" y2="{{g.y}}" stroke="#1B2030" stroke-width="1"></line>
<text x="32" y="{{g.ty}}" text-anchor="end" fill="#6B7488" font-size="11" font-family="Geist Mono, monospace">{{g.label}}</text>
</sc-for>
<sc-for list="{{c.xlabels}}" as="x" hint-placeholder-count="3">
<text x="{{x.x}}" y="214" text-anchor="{{x.anchor}}" fill="#6B7488" font-size="11" font-family="Geist Mono, monospace">{{x.label}}</text>
</sc-for>
<polyline points="{{c.points}}" fill="none" stroke="#6E9BFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
<circle cx="{{c.lastX}}" cy="{{c.lastY}}" r="4.5" fill="#6E9BFF" stroke="#11141C" stroke-width="2"></circle>
<sc-for list="{{c.hits}}" as="h" hint-placeholder-count="10">
<rect x="{{h.x}}" y="0" width="{{h.w}}" height="196" fill="transparent" onMouseEnter="{{h.enter}}" onMouseLeave="{{c.leave}}"></rect>
</sc-for>
</svg>
<sc-if value="{{c.hover}}" hint-placeholder-val="{{false}}">
<div style="{{c.hover.line}}"></div>
<div style="{{c.hover.dot}}"></div>
<div style="{{c.hover.tip}}"><span style="font-family: 'Geist Mono', monospace; font-size: 14px; color: #E8ECF4">{{c.hover.value}}</span><span style="font-size: 11px; color: #9AA3B5">{{c.hover.date}}</span></div>
</sc-if>
</div>
</section>
</sc-for>
</div>
</sc-if>

<section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #11141C; border: 1px solid #1B2030; border-radius: 18px; overflow: hidden">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px 20px; font-size: 12px; color: #9AA3B5; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid #1B2030">
<span>Date</span><span>Weight</span><span>Body fat</span><span>Source</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 20px; font-size: 14px; border-bottom: 1px solid #161B27">
<span style="color: #CBD2E0">{{r.date}}</span><span style="font-family: 'Geist Mono', monospace">{{r.w}} lb</span><span style="font-family: 'Geist Mono', monospace">{{r.b}}%</span><span style="color: #9AA3B5">{{r.src}}</span>
</div>
</sc-for>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: '90D', view: 'chart', hover: null };
    const data = [];
    const end = new Date(2026, 8, 28);
    for (let i = 0; i < 104; i++) {
      const d = new Date(end); d.setDate(end.getDate() - (103 - i) * 3.5);
      const t = i / 103;
      data.push({ d, w: Math.round((184 - 11.6 * t + Math.sin(i * 1.3) * 0.7 + Math.sin(i * 0.31) * 0.9) * 10) / 10, b: Math.round((20.1 - 4.3 * t + Math.sin(i * 1.1) * 0.25) * 10) / 10 });
    }
    data[103].w = 172.4; data[103].b = 15.8;
    this.data = data;
  }
  fmt(d) { return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate(); }
  chart(key, title, unit, pts, dec) {
    const W0 = 44, W1 = 480, H0 = 12, H1 = 190;
    const vals = pts.map((p) => p[key]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.15 || 1; lo -= pad; hi += pad;
    const X = (i) => W0 + (pts.length === 1 ? 0 : i * (W1 - W0) / (pts.length - 1));
    const Y = (v) => H0 + (1 - (v - lo) / (hi - lo)) * (H1 - H0);
    const grid = [0, 0.5, 1].map((f) => { const v = lo + (hi - lo) * (1 - f); const y = H0 + f * (H1 - H0); return { y: y.toFixed(1), ty: (y + 4).toFixed(1), label: v.toFixed(dec) }; });
    const n = pts.length;
    const xlabels = [0, Math.floor((n - 1) / 2), n - 1].map((i, k) => ({ x: X(i).toFixed(1), label: this.fmt(pts[i].d), anchor: k === 0 ? 'start' : k === 2 ? 'end' : 'middle' }));
    const step = n > 1 ? (W1 - W0) / (n - 1) : 20;
    const hits = pts.map((p, i) => ({ x: (X(i) - step / 2).toFixed(1), w: Math.max(step, 4).toFixed(1), enter: () => this.setState({ hover: { key, i } }) }));
    const first = vals[0], last = vals[n - 1];
    const diff = Math.round((last - first) * 10) / 10;
    let hover = null;
    const h = this.state.hover;
    if (h && h.key === key && pts[h.i]) {
      const x = X(h.i), y = Y(pts[h.i][key]);
      const left = Math.min(Math.max(x - 50, 0), 390);
      hover = {
        value: pts[h.i][key].toFixed(1) + ' ' + unit, date: this.fmt(pts[h.i].d),
        line: 'position: absolute; left: ' + x.toFixed(1) + 'px; top: 12px; width: 1px; height: 178px; background: #3A4257; pointer-events: none;',
        dot: 'position: absolute; left: ' + (x - 5).toFixed(1) + 'px; top: ' + (y - 5).toFixed(1) + 'px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 999px; background: #6E9BFF; border: 2px solid #11141C; pointer-events: none;',
        tip: 'position: absolute; left: ' + left.toFixed(1) + 'px; top: ' + Math.max(y - 58, 0).toFixed(1) + 'px; width: 100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: #1A2033; border: 1px solid #2C3346; border-radius: 10px; pointer-events: none;'
      };
    }
    return {
      title, unit, current: last.toFixed(1), change: (diff > 0 ? '+' : '') + diff + (unit === '%' ? ' pts' : ' ' + unit) + ' this range',
      aria: title + ' over the selected range, from ' + first + ' to ' + last,
      grid, xlabels, hits, hover, leave: () => this.setState({ hover: null }),
      points: pts.map((p, i) => X(i).toFixed(1) + ',' + Y(p[key]).toFixed(1)).join(' '),
      lastX: X(n - 1).toFixed(1), lastY: Y(last).toFixed(1)
    };
  }
  renderVals() {
    const counts = { '7D': 3, '30D': 9, '90D': 26, '1Y': 104, 'All': 104 };
    const pts = this.data.slice(-counts[this.state.range]);
    const seg = (on) => 'height: 38px; padding: 0 12px; border: none; border-radius: 9px; font-size: 13px; cursor: pointer; ' + (on ? 'background: #E8ECF4; color: #0A0C12; font-weight: 500;' : 'background: transparent; color: #CBD2E0;');
    const ranges = Object.keys(counts).map((r) => ({ label: r, on: this.state.range === r, style: seg(this.state.range === r) + ' font-family: Geist Mono, monospace;', pick: () => this.setState({ range: r, hover: null }) }));
    const views = [['chart', 'Chart'], ['table', 'Table']].map(([k, label]) => ({ label, on: this.state.view === k, style: seg(this.state.view === k), pick: () => this.setState({ view: k }) }));
    const showChart = this.state.view === 'chart';
    const rowCount = showChart ? 4 : 13;
    const rows = pts.slice(-rowCount).reverse().map((p, i) => ({ date: this.fmt(p.d), w: p.w.toFixed(1), b: p.b.toFixed(1), src: i === 0 ? 'Check-in, 8:00 AM' : 'Check-in' }));
    return { ranges, views, showChart, rows, charts: [this.chart('w', 'Weight', 'lb', pts, 0), this.chart('b', 'Body fat', '%', pts, 1)] };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sanctum today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#0A0C12;color:#E8ECF4}
a{color:#6E9BFF}a:hover{color:#9DBBFF}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 720px; box-sizing: border-box; background: #0A0C12; color: #E8ECF4; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 24px 28px 28px">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M5 23V12.5a8 8 0 0 1 16 0V23" stroke="#6E9BFF" stroke-width="1.6"></path><path d="M2.5 23h21" stroke="#6E9BFF" stroke-width="1.6" stroke-linecap="round"></path><circle cx="13" cy="16" r="2.6" fill="#6E9BFF"></circle></svg>
<nav aria-label="Main" style="display: flex; gap: 4px; margin-left: 12px">
<a href="Main.dc.html" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; font-size: 14px; color: #9AA3B5; text-decoration: none">Focus</a>
<a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; font-size: 14px; background: #161C2B; color: #E8ECF4; text-decoration: none">Today</a>
<a href="Fitness.dc.html" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; font-size: 14px; color: #9AA3B5; text-decoration: none">Trackers</a>
<a href="Calendar.dc.html" style="height: 40px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; font-size: 14px; color: #9AA3B5; text-decoration: none">Calendar</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<label style="display: flex; align-items: center; gap: 10px; width: 380px; height: 44px; box-sizing: border-box; padding: 0 14px; background: #11141C; border: 1px solid #232939; border-radius: 12px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA3B5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span style="position: absolute; left: -9999px">Add a todo</span>
<input placeholder="Add a todo… try &quot;mock interview thu 3pm&quot;" style="flex-grow: 1; background: transparent; border: none; outline: none; color: #E8ECF4; font-size: 14px">
</label>
</div>
</header>

<div style="display: flex; gap: 12px">
<sc-for list="{{systems}}" as="s" hint-placeholder-count="3">
<a href="{{s.href}}" style="flex: 1 1 0; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #11141C; border: 1px solid #1B2030; border-radius: 14px; text-decoration: none; color: #E8ECF4">
<span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #161C2B; color: #6E9BFF; font-size: 16px; font-weight: 700; font-family: 'Geist', sans-serif">{{s.glyph}}</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 500">{{s.name}}</span>
<span style="font-size: 12px; color: #9AA3B5; font-family: 'Geist Mono', monospace">{{s.meta}}</span>
</span>
</a>
</sc-for>
</div>

<div style="flex-grow: 1; display: flex; gap: 16px; min-height: 0">

<section style="width: 330px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #11141C; border: 1px solid #1B2030; border-radius: 18px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Geist', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.035em; font-size: 24px; line-height: 1.1">Daily <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: -0.01em; color: #8C96AB">non-negotiables</span></h2>
<span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #9AA3B5">{{doneCount}} / {{total}}</span>
</div>
<div style="height: 4px; background: #1E2433; border-radius: 999px; overflow: hidden"><div style="{{bar}}"></div></div>
<div style="display: flex; flex-direction: column; gap: 1px; margin-top: 4px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="12">
<button onClick="{{g.toggle}}" role="checkbox" aria-checked="{{g.done}}" style="display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 6px; background: transparent; border: none; border-radius: 8px; cursor: pointer; text-align: left">
<span style="{{g.box}}"><sc-if value="{{g.done}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0A0C12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if></span>
<span style="{{g.text}}">{{g.name}}</span>
<sc-if value="{{g.focus}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; font-size: 11px; color: #6E9BFF">Enter</span></sc-if>
</button>
</sc-for>
</div>
</section>

<section style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #11141C; border: 1px solid #1B2030; border-radius: 18px; min-width: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: 'Geist', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.035em; font-size: 24px; line-height: 1.1">This <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; font-size: 1.1em; letter-spacing: -0.01em; color: #8C96AB">week</span></h2>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA3B5"><span style="width: 6px; height: 6px; border-radius: 999px; background: #5FD4C8"></span>Synced with Google Calendar</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="{{d.head}}">{{d.name}}</span>
<sc-for list="{{d.items}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; min-height: 28px">
<span style="{{t.box}}"></span>
<span style="{{t.text}}">{{t.name}}</span>
<sc-if value="{{t.time}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-family: 'Geist Mono', monospace; font-size: 11px; color: #9AA3B5"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>{{t.time}}</span></sc-if>
<sc-if value="{{t.repeat}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; color: #6B7488">↻</span></sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      goals: [
        { name: 'Gym', done: true }, { name: 'Cardio / abs', done: true }, { name: 'Job search', done: true },
        { name: 'NeetCode', done: true }, { name: 'Work session: SQL + DSA', done: false, focus: true },
        { name: 'Eat once', done: true }, { name: 'Vitamins', done: true }, { name: 'Shower', done: false },
        { name: 'Work session: projects / Filmadi', done: true, focus: true }, { name: 'Eat again / smoothie', done: false },
        { name: 'Work session: verbal interview prep', done: false, focus: true }, { name: 'Apply again', done: false }
      ]
    };
  }
  renderVals() {
    const box = (on) => 'width: 18px; height: 18px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 5px; ' + (on ? 'background: #6E9BFF; border: 1px solid #6E9BFF;' : 'border: 1.5px solid #3A4257;');
    const text = (on) => 'font-size: 14px; ' + (on ? 'color: #6B7488; text-decoration: line-through;' : 'color: #E8ECF4;');
    const goals = this.state.goals.map((g, i) => ({
      ...g, box: box(g.done), text: text(g.done), focus: !!g.focus && !g.done,
      toggle: () => this.setState({ goals: this.state.goals.map((x, j) => j === i ? { ...x, done: !x.done } : x) })
    }));
    const doneCount = goals.filter((g) => g.done).length;
    const mk = (name, o) => ({ name, time: (o && o.time) || '', repeat: !!(o && o.repeat), box: box(o && o.done), text: text(o && o.done).replace('14px', '13px') });
    const days = [
      { name: 'Mon · today', today: true, items: [mk('Weigh + check-in', { time: '8:00a', repeat: true }), mk('Morning meeting', { time: '9:00a', repeat: true, done: true })] },
      { name: 'Tue', items: [mk('Behavioral stories', { time: '10:00a' })] },
      { name: 'Wed', items: [mk('Recruiter call', { time: '3:00p' })] },
      { name: 'Thu', items: [mk('Weigh + check-in', { time: '8:00a', repeat: true }), mk('Reply to emails', { done: true }), mk('Sheets laundry')] },
      { name: 'Fri', items: [mk('Portfolio updates', { time: '1:00p' })] },
      { name: 'Sat', items: [mk('Weekly review')] },
      { name: 'Sun', items: [mk('Plan next week')] },
      { name: 'Every weekday', items: [mk('Evening Filmadi meeting', { time: '6:00p', repeat: true })] }
    ].map((d) => ({ ...d, head: 'font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; ' + (d.today ? 'color: #6E9BFF;' : 'color: #9AA3B5;') }));
    const systems = [
      { name: 'Journal', glyph: 'J', meta: 'Last entry: yesterday', href: '#' },
      { name: 'Fitness', glyph: 'F', meta: '172.4 lb · 15.8% BF', href: 'Fitness.dc.html' },
      { name: 'LeetCode', glyph: 'L', meta: '9 day streak · 212 solved', href: '#' }
    ];
    return { goals, doneCount, total: goals.length, bar: 'height: 100%; width: ' + Math.round(doneCount / goals.length * 100) + '%; background: #6E9BFF; border-radius: 999px;', days, systems };
  }
}
</script>
</body>
</html>

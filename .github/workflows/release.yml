name: Release

# Push a tag like v0.2.0 (matching the version in tauri.conf.json and Cargo.toml) to build the
# Windows installer and publish it, with latest.json for the in-app updater.
# The installer is not code-signed (decided 2026-09-30); Windows SmartScreen will warn once.

on:
  push:
    tags: ["v*"]
  # A test run from the Actions tab builds the same release as a draft under a "test-" tag.
  # Installed copies never see a draft, and the tag doesn't match v*, so nothing ships.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            partner/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The root tests render the partner site, which needs its own dependencies (supabase-js).
      - run: npm ci --prefix partner
      - run: npm test
      # The release notes are this version's CHANGELOG.md section (the site's /changelog reads
      # them); tagging a version without a section stops here.
      - id: notes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            version="${{ github.ref_name }}"
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            echo "name=Sanctum $version" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            version="v$(node -p "require('./package.json').version")"
            echo "tag=test-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Sanctum $version (test build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'body<<NOTES_EOF'
            node scripts/release-notes.mjs "$version"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates so only published builds install (not Windows code signing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: the official build's services (docs/self-hosting.md). Unset = off.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SANCTUM_SUPABASE_URL: ${{ vars.SANCTUM_SUPABASE_URL }}
          SANCTUM_SUPABASE_KEY: ${{ vars.SANCTUM_SUPABASE_KEY }}
          SANCTUM_PARTNER_URL: ${{ vars.SANCTUM_PARTNER_URL }}
        with:
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: ${{ steps.notes.outputs.name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseCommitish: ${{ github.sha }}
          # Published as soon as it builds (decided 2026-10-29): installed copies see it within hours.
          # A test run stays a draft.
          releaseDraft: ${{ steps.notes.outputs.draft }}
          prerelease: false
          # latest.json links to each installer through the GitHub API (tauri-action v1); the
          # updater sends Accept: application/octet-stream, so those links download the file.
          uploadUpdaterJson: true
          # Update artifacts need the private key, so only releases make them.
          args: --config {"bundle":{"createUpdaterArtifacts":true}}
      # The release as installed copies will meet it: latest.json names this version, each
      # installer link downloads an installer, and each signature verifies against the app's
      # key. A published release is also read from the public endpoint, with no token.
      - name: Check the update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-update.mjs "${{ steps.notes.outputs.tag }}"
      # A test run removes its draft once the check passes (a failed one is kept to look at).
      - name: Remove the test draft
        if: github.event_name != 'push' && steps.release.outputs.releaseId != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/releases/${{ steps.release.outputs.releaseId }}"

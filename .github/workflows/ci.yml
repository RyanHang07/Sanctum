name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Run by hand on any branch from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            partner/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The root tests render the partner site, which needs its own dependencies (supabase-js).
      - run: npm ci --prefix partner
      - run: npm run typecheck
      - run: npm test
      # No keys in CI: Calendar and accounts build as "not set up", which is a supported mode.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
